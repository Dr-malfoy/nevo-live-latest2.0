# Render blueprint for the Nevo Live backend (Express + Socket.IO)
# Deploy: connect this repo in Render → "Blueprint" → select render.yaml
# Or create a Web Service manually with the settings below.
services:
  - type: web
    name: nevo-live-latest
    runtime: node
    plan: starter # Starter plan recommended for persistent WebSocket connections
    region: singapore # Closest region for low latency
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:backend
    startCommand: node packages/backend/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        value: mongodb+srv://rijomkumar_db_user:UqKjjbakeUlEJDjE@cluster0.cw4qnjy.mongodb.net/bogolive?retryWrites=true&w=majority&appName=Cluster0
