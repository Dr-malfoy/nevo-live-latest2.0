version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: bogolive-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bogolive-api
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://root:rootpassword@mongodb:27017/bogolive?authSource=admin
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/shared/src:/app/packages/shared/src
    command: npm run dev:backend

volumes:
  mongo_data:
